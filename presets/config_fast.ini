# ----------- [ 快速/高配置 预设 ] -----------

# ============================================================
#  Falling Images  配置文件
#  改完保存 -> 重启程序生效 (不用重新编译, 也不用重新下载)
#
#  格式:   键 = 值
#  '#' 或 ';' 开头的整行是注释; 行中间只有前面是空白才算注释
#  删掉某一行 = 该参数用程序内置的默认值
#  写错的键/值会被忽略并在启动时提示, 不影响程序运行
#
#  图片分三类, 各放一个文件夹:
#     images\blocks      方块    —— 不会自己爆炸, 只会被炸掉
#     images\explosives  爆炸物  —— 有引信, 到点自己爆炸
#     images\buildings   建筑    —— 地形, 不会掉, 只能按手动键放
#     images 根目录下的图片按"爆炸物"处理(兼容老版本)
#
#  这是一个预设: 把它复制到上一级目录(exe 旁边), 改名成 config.ini
#  覆盖即可, 重启程序生效。键集与 config.ini 完全一致, 只是数值不同。
#
#  本文件由程序自动生成, 只在它不存在时创建, 永远不会覆盖你的修改。
# ============================================================

# ------------------------------------------------------------
# --- 通用 common
#     三类都适用的东西: 生成节奏、窗口扫描、碰撞反馈、按键
# ------------------------------------------------------------
SPAWN_FIRST_DELAY = 0.5           # 启动后第一张图片出现前的等待, 秒
DROPTIME_MIN = 0.08               # 两次自动生成的最小间隔, 秒(掉落快慢主要看这两个)
DROPTIME_MAX = 0.5                # 两次自动生成的最大间隔, 秒
WINDOW_SCAN_SEC = 0.11            # 窗口位置扫描间隔, 秒(越小越跟手, 也越费 CPU)
SWEEP_MIN_VX = 260                # 窗口横向速度超过它就把图片"创飞", 像素/秒
FOLLOW_SANITY_VX = 20000          # 跟随窗口时的荒谬速度上限, 挡窗口矩形抖动用
MAX_FALLING = 300                 # 同屏"正在下落"的数量上限(方块 + 爆炸物 加起来)
MAX_TOTAL = 220                   # 精灵总数上限(含爆炸碎片)
DEBRIS_COLS = 9                   # 爆炸碎片列数
DEBRIS_ROWS = 9                   # 爆炸碎片行数
AUTO_SPAWN_ENABLED = true         # 自动随机下落 true / false
MANUAL_SPAWN_ENABLED = true       # 手动生成总开关: false = 三个键全废(连钩子都不装)
SPAWN_KEY_DEBOUNCE_MS = 50        # 同一个键两次触发的最小间隔, 毫秒(挡长按重复)

# ------------------------------------------------------------
# --- 方块 blocks  (images\blocks)
#     不会自己爆炸, 也不会闪; 只有被爆炸波及时才会炸成碎片
# ------------------------------------------------------------
BLOCKS_ENABLED = true             # false = 完全不生成方块(blocks 文件夹也不会读)
BLOCK_MANUAL_SPAWN_ENABLED = true # false = 按 BLOCK_SPAWN_KEY 没反应(自动生成不受影响)
BLOCK_MAX_IMAGES = 20             # blocks 文件夹最多读几张图(按文件名排序, 不是同屏数量)
BLOCK_MAX_ONSCREEN = 0            # 同屏方块数量上限(0 = 不限, 只受 MAX_FALLING 管)
BLOCK_SIZE = 24                   # 方块显示边长, 像素(会自动缩放)
BLOCK_SPAWN_WEIGHT = 1            # 每张方块图的生成权重, 0 = 不出方块
BLOCK_SPAWN_KEY = ","             # 按这个键在鼠标位置生成一个方块(一个字符或虚拟键码数字)
BLOCK_FALL_SPEED_MIN = 1100       # 方块下落速度下限, 像素/秒
BLOCK_FALL_SPEED_MAX = 2000       # 方块下落速度上限, 像素/秒
BLOCK_STAY_SEC = 0                # 方块停稳后停留几秒消失(淡出, 不爆炸); 0 = 一直留着
BLOCK_FADE_SEC = 0.5              # 方块消失前的淡出时长, 秒(0 = 直接不见)
BLOCK_DESTROY_IN_BLAST = true     # 爆炸范围内的方块会被炸掉 true / false
BLOCK_HIT_FLASH_SEC = 0.1         # 方块被撞后"闪一下"的时长, 秒(0 = 不闪)
BLOCK_HIT_DIM = 0.7               # 方块闪到最浅时的 alpha, 0~1(1 = 看不出闪)

# ------------------------------------------------------------
# --- 爆炸物 explosives  (images\explosives)
#     有引信, 时间到了自己爆炸, 并把范围内的一切炸飞
# ------------------------------------------------------------
EXPLOSIVES_ENABLED = true         # false = 完全不生成爆炸物(explosives 文件夹也不会读)
EXPLOSIVE_MANUAL_SPAWN_ENABLED = true # false = 按 EXPLOSIVE_SPAWN_KEY 没反应(自动生成不受影响)
EXPLOSIVE_MAX_IMAGES = 20         # explosives 文件夹最多读几张图(按文件名排序, 不是同屏数量)
EXPLOSIVE_MAX_ONSCREEN = 0        # 同屏爆炸物数量上限(0 = 不限, 只受 MAX_FALLING 管)
EXPLOSIVE_SIZE = 24               # 爆炸物显示边长, 像素(会自动缩放)
EXPLOSIVE_SPAWN_WEIGHT = 1        # 每张爆炸物图的生成权重, 0 = 不出爆炸物(和方块权重比大小)
EXPLOSIVE_SPAWN_KEY = "."         # 按这个键在鼠标位置生成一个爆炸物(一个字符或虚拟键码数字)
EXPLOSIVE_FALL_SPEED_MIN = 1100   # 爆炸物下落速度下限, 像素/秒
EXPLOSIVE_FALL_SPEED_MAX = 2200   # 爆炸物下落速度上限, 像素/秒
EXPLOSIVE_HIT_FLASH_SEC = 0.2     # 爆炸物被撞后"闪一下"的时长, 秒(0 = 不闪)
EXPLOSIVE_HIT_DIM = 0.82          # 爆炸物闪到最浅时的 alpha, 0~1(1 = 看不出闪)
EXPLOSIVE_LIFE_SEC = 5            # 引信: 生成后几秒自己爆炸
EXPLODE_WARN_SEC = 3              # 爆炸前多少秒开始闪烁(比引信长也没关系, 会自动截断)
EXPLODE_BLINK_PERIOD = 0.3        # 闪烁周期, 秒
EXPLODE_BLINK_MIN = 0.81          # 闪烁时最浅的 alpha, 0~1
EXPLOSION_RADIUS = 250            # 爆炸冲击波半径, 像素
EXPLOSION_POWER_MIN = 590         # 冲击波初速(范围边缘), 像素/秒
EXPLOSION_POWER_MAX = 1300        # 冲击波初速(爆心附近), 像素/秒
EXPLOSION_GRAVITY = 1450          # 被炸飞之后的重力
FAST_HIT_SPEED = 1800             # 相对速度超过它算"特别快的撞击", 像素/秒
FAST_HIT_LIFE_LOSS = 0.9          # 高速撞击扣掉的引信时间, 秒(只对爆炸物有效)

# ------------------------------------------------------------
# --- 建筑 buildings  (images\buildings)
#     地形: 不掉不被推不被炸飞, 只按手动键放; 挨满几次爆炸才碎
# ------------------------------------------------------------
BUILDINGS_ENABLED = true          # false = 完全不生成建筑(buildings 文件夹也不会读)
BUILDING_MANUAL_SPAWN_ENABLED = true # false = 按 BUILDING_SPAWN_KEY 没反应(建筑本来就只能手动放)
BUILDING_MAX_IMAGES = 20          # buildings 文件夹最多读几张图(按文件名排序)
BUILDING_SIZE = 24                # 建筑显示边长, 像素(会自动缩放)
BUILDING_SPAWN_KEY = "/"          # 按这个键在鼠标位置放一个建筑(一个字符或虚拟键码数字)
BUILDING_SNAP = 24                # 吸附到几像素的网格, 占光标所在那一格(0 = 不吸附, 摆墙对齐用)
BUILDING_BLAST_HITS = 5           # 挨几次爆炸后碎掉(0 = 永远炸不掉)
BUILDING_HIT_FLASH_SEC = 0.35     # 建筑挨炸后"闪一下"的时长, 秒(0 = 不闪)
BUILDING_HIT_DIM = 0.75           # 建筑闪到最浅时的 alpha, 0~1(1 = 看不出闪)
