# ============================================================
#  Falling Images  配置文件
#  改完保存 -> 重启程序生效 (不用重新编译, 也不用重新下载)
#
#  格式:   键 = 值
#  '#' 或 ';' 开头的整行是注释; 行中间只有前面是空白才算注释
#  删掉某一行 = 该参数用程序内置的默认值
#  写错的键/值会被忽略并在启动时提示, 不影响程序运行
#
#  图片分两类, 各放一个文件夹:
#     images\blocks      方块    —— 不会自己爆炸, 只会被炸掉
#     images\explosives  爆炸物  —— 有引信, 到点自己爆炸
#     images 根目录下的图片按"爆炸物"处理(兼容老版本)
#
#  本文件由程序自动生成, 只在它不存在时创建, 永远不会覆盖你的修改。
# ============================================================

# ------------------------------------------------------------
# --- 通用 common
#     两边都适用的东西: 生成节奏、窗口扫描、碰撞反馈、按键
# ------------------------------------------------------------
SPAWN_FIRST_DELAY = 0.8           # 启动后第一张图片出现前的等待, 秒
DROPTIME_MIN = 0.2                # 两次自动生成的最小间隔, 秒(掉落快慢主要看这两个)
DROPTIME_MAX = 1.3                # 两次自动生成的最大间隔, 秒
WINDOW_SCAN_SEC = 0.09            # 窗口位置扫描间隔, 秒(越小越跟手, 也越费 CPU)
SWEEP_MIN_VX = 260                # 窗口横向速度超过它就把图片"创飞", 像素/秒
FOLLOW_SANITY_VX = 20000          # 跟随窗口时的荒谬速度上限, 挡窗口矩形抖动用
MAX_FALLING = 120                  # 同屏"正在下落"的数量上限(方块 + 爆炸物 加起来)
MAX_TOTAL = 220                   # 精灵总数上限(含爆炸碎片)
DEBRIS_COLS = 4                   # 爆炸碎片列数
DEBRIS_ROWS = 4                   # 爆炸碎片行数
AUTO_SPAWN_ENABLED = true         # 自动随机下落 true / false
MANUAL_SPAWN_ENABLED = true       # 按下面两节里配的键手动生成 true / false
SPAWN_KEY_DEBOUNCE_MS = 250       # 同一个键两次触发的最小间隔, 毫秒(挡长按重复)

# ------------------------------------------------------------
# --- 方块 blocks  (images\blocks)
#     不会自己爆炸, 也不会闪; 只有被爆炸波及时才会炸成碎片
# ------------------------------------------------------------
BLOCKS_ENABLED = true             # false = 完全不生成方块(blocks 文件夹也不会读)
BLOCK_MAX_IMAGES = 8              # blocks 文件夹最多读几张图(按文件名排序, 不是同屏数量)
BLOCK_MAX_ONSCREEN = 0            # 同屏方块数量上限(0 = 不限, 只受 MAX_FALLING 管)
BLOCK_SIZE = 48                   # 方块显示边长, 像素(会自动缩放)
BLOCK_SPAWN_WEIGHT = 1            # 每张方块图的生成权重, 0 = 不出方块
BLOCK_SPAWN_KEY = ","             # 按这个键在鼠标位置生成一个方块(一个字符或虚拟键码数字)
BLOCK_FALL_SPEED_MIN = 450        # 方块下落速度下限, 像素/秒
BLOCK_FALL_SPEED_MAX = 700        # 方块下落速度上限, 像素/秒
BLOCK_STAY_SEC = 12               # 方块停稳后停留几秒消失(淡出, 不爆炸); 0 = 一直留着
BLOCK_FADE_SEC = 1.5              # 方块消失前的淡出时长, 秒(0 = 直接不见)
BLOCK_DESTROY_IN_BLAST = true     # 爆炸范围内的方块会被炸掉 true / false
BLOCK_HIT_FLASH_SEC = 0.1         # 方块被撞后"闪一下"的时长, 秒(0 = 不闪)
BLOCK_HIT_DIM = 0.63               # 方块闪到最浅时的 alpha, 0~1(1 = 看不出闪)

# ------------------------------------------------------------
# --- 爆炸物 explosives  (images\explosives)
#     有引信, 时间到了自己爆炸, 并把范围内的一切炸飞
# ------------------------------------------------------------
EXPLOSIVES_ENABLED = true         # false = 完全不生成爆炸物(explosives 文件夹也不会读)
EXPLOSIVE_MAX_IMAGES = 15         # explosives 文件夹最多读几张图(按文件名排序, 不是同屏数量)
EXPLOSIVE_MAX_ONSCREEN = 0        # 同屏爆炸物数量上限(0 = 不限, 只受 MAX_FALLING 管)
EXPLOSIVE_SIZE = 48               # 爆炸物显示边长, 像素(会自动缩放)
EXPLOSIVE_SPAWN_WEIGHT = 1        # 每张爆炸物图的生成权重, 0 = 不出爆炸物(和方块权重比大小)
EXPLOSIVE_SPAWN_KEY = "."         # 按这个键在鼠标位置生成一个爆炸物(一个字符或虚拟键码数字)
EXPLOSIVE_FALL_SPEED_MIN = 450    # 爆炸物下落速度下限, 像素/秒
EXPLOSIVE_FALL_SPEED_MAX = 700    # 爆炸物下落速度上限, 像素/秒
EXPLOSIVE_HIT_FLASH_SEC = 0.3     # 爆炸物被撞后"闪一下"的时长, 秒(0 = 不闪)
EXPLOSIVE_HIT_DIM = 0.58           # 爆炸物闪到最浅时的 alpha, 0~1(1 = 看不出闪)
EXPLOSIVE_LIFE_SEC = 5            # 引信: 生成后几秒自己爆炸
EXPLODE_WARN_SEC = 3              # 爆炸前多少秒开始闪烁(比引信长也没关系, 会自动截断)
EXPLODE_BLINK_PERIOD = 0.48        # 闪烁周期, 秒
EXPLODE_BLINK_MIN = 0.48          # 闪烁时最浅的 alpha, 0~1
EXPLOSION_RADIUS = 310            # 爆炸冲击波半径, 像素
EXPLOSION_POWER_MIN = 500         # 冲击波初速(范围边缘), 像素/秒
EXPLOSION_POWER_MAX = 900         # 冲击波初速(爆心附近), 像素/秒
EXPLOSION_GRAVITY = 1350          # 被炸飞之后的重力
FAST_HIT_SPEED = 1650             # 相对速度超过它算"特别快的撞击", 像素/秒
FAST_HIT_LIFE_LOSS = 2.5          # 高速撞击扣掉的引信时间, 秒(只对爆炸物有效)

# ------------------------------------------------------------
# --- 建筑 buildings  (images\buildings)
#     地形: 不掉、不被窗口推、不被爆炸掀飞, 放下来就一直在那
#     只有按下面的键才会出现 —— 自动随机下落永远不挑它
#     别的图片能落在它顶边(地板)、被它侧面挡住(墙壁)、从下面顶到它底边(天花板)
#     它不挡爆炸; 挨满 BUILDING_BLAST_HITS 次爆炸后碎成碎片(不放冲击波)
# ------------------------------------------------------------
BUILDINGS_ENABLED = true          # false = 完全不生成建筑(buildings 文件夹也不会读)
BUILDING_MAX_IMAGES = 8           # buildings 文件夹最多读几张图(按文件名排序)
BUILDING_SIZE = 48                # 建筑显示边长, 像素(会自动缩放)
BUILDING_SPAWN_KEY = "/"          # 按这个键在鼠标位置放一个建筑(一个字符或虚拟键码数字)
BUILDING_SNAP = 48                 # 吸附到几像素的网格: 建筑占"光标所在那一格"(0 = 不吸附, 摆墙对齐用)
BUILDING_BLAST_HITS = 3           # 挨几次爆炸后碎掉(0 = 永远炸不掉)
BUILDING_HIT_FLASH_SEC = 0.35     # 建筑挨炸后"闪一下"的时长, 秒(0 = 不闪)
BUILDING_HIT_DIM = 0.45           # 建筑闪到最浅时的 alpha, 0~1(1 = 看不出闪)
